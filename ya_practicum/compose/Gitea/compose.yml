services:
  gitea:
    image: gitea/gitea:1.24.2
    environment:
        DB_TYPE: ${DB_TYPE}
        DB_HOST: ${DB_HOST}
        DB_NAME: ${DB_NAME}
        DB_USER: ${DB_USER}
        DB_PASSWD: ${DB_PASSWD}
    restart: always
    volumes:
      - git_data:/data
    ports:
      - 3000:3000
    depends_on:
      - db


  db:
    image: postgres:17-alpine3.22
    environment:
        POSTGRES_DB: ${DB_NAME}
        POSTGRES_USER: ${DB_USER}
        POSTGRES_PASSWORD: ${DB_PASSWD}
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  git_data:
  postgres_data:
